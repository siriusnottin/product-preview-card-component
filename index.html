<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="./images/favicon-32x32.png"
		/>
		<title>Frontend Mentor | Product preview card component</title>
		<link rel="stylesheet" href="./styles/main.css" />
	</head>
	<body>
		<main class="main-container">
			<div class="product-preview">
				<div class="product-preview-image">
					<img
						srcset="
							./images/image-product-mobile.jpg  600w,
							./images/image-product-desktop.jpg 900w
						"
						sizes="(max-width: 600px) 100vw, 50vw"
						alt="A square bottle of Gabrielle Chanel perfume is displayed diagonally, framed by green leafy stems on a white background."
					/>
				</div>
				<div class="product-preview-content">
					<div class="product-preview-content-header">
						<h1 class="product-title">Gabrielle Essence Eau De Parfum</h1>
						<h2 class="product-category">Perfume</h2>
					</div>
					<p class="product-description">
						A floral, solar and voluptuous interpretation composed by Olivier
						Polge, Perfumer-Creator for the House of CHANEL.
					</p>
					<p class="product-price">
						<span class="product-price-value">$149.99</span>
						<span class="product-price-discount">$169.99</span>
					</p>
					<div class="product-preview-content-actions">
						<button type="button" class="btn btn-primary" id="addToCart">
							<span class="btn-icon">
								<img src="./images/icon-cart.svg" alt="Shopping cart icon" />
							</span>
							Add to Cart
						</button>
					</div>
				</div>
			</div>
		</main>

		<footer class="footer-attribution">
			Challenge by
			<a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
				>Frontend Mentor</a
			>. Coded by <a href="https://nottin.me" target="_blank">Sirius Nottin</a>.
		</footer>
	</body>
</html>
